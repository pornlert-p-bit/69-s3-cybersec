services:
  db:
    image: postgres:16-alpine
    container_name: 69-s3-db
    ports:
      - 54327:5432
    environment:
      - POSTGRES_PASSWORD=lek1234
      - POSTGRES_USER=pornlert
      - POSTGRES_DB=pornlert

  admin:
    image: dpage/pgadmin4:9.16
    container_name: 69-s3-admin
    ports:
      - 8083:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=pornlert-p@rmutp.ac.th
      - PGADMIN_DEFAULT_PASSWORD=lek1234
    depends_on:
      - db
